name: Validate Games of Alia
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check config.js
          node --check questions.js
          node --check app.js
          node --check tests/validate-engine.js
          node --check tests/smoke-page.js
      - name: Validate learning engine and encounter capacity
        run: node tests/validate-engine.js
      - name: Smoke test homepage and Builder Quest page
        run: node tests/smoke-page.js
      - name: Check site architecture
        run: |
          grep -q 'Games of Alia' index.html
          grep -q 'href="builder-quest/"' index.html
          grep -q '<script src="../config.js"></script>' builder-quest/index.html
          grep -q '<script src="../questions.js"></script>' builder-quest/index.html
          grep -q '<script src="../app.js"></script>' builder-quest/index.html
          ! grep -q '^<script>$' builder-quest/index.html
      - name: Check governing files
        run: |
          test -s README.md
          test -s BUILDER_QUEST_GOVERNING_SPEC.md
