name: Validate Builder Quest
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check config.js
          node --check questions.js
          node --check app.js
      - name: Check page architecture
        run: |
          grep -q '<script src="config.js"></script>' index.html
          grep -q '<script src="questions.js"></script>' index.html
          grep -q '<script src="app.js"></script>' index.html
          ! grep -q '^<script>$' index.html
      - name: Check governing files
        run: |
          test -s README.md
          test -s BUILDER_QUEST_GOVERNING_SPEC.md
