name: Deploy Games of Alia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare approved logo assets
        run: |
          mkdir -p assets icons
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path('icons/games-of-alia-180.png')
          if not source.is_file():
              raise SystemExit('Approved Games of Alia production icon is missing.')

          with Image.open(source) as opened:
              img = opened.convert('RGBA')

          if img.size != (180, 180) or img.getextrema()[3][0] == 255:
              raise SystemExit('Approved Games of Alia production icon is invalid.')

          Path('assets/games-of-alia-logo.png').write_bytes(source.read_bytes())
          for size in (180, 192, 512):
              out = img if size == 180 else img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(Path('icons') / f'games-of-alia-{size}.png', 'PNG', optimize=True)

          print('Approved Games of Alia production artwork prepared for deployment.')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
