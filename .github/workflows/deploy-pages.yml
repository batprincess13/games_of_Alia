name: Deploy Games of Alia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build approved install icons
        run: |
          cat \
            icons/source/approved-00.b64 \
            icons/source/approved-01.b64 \
            icons/source/approved-02a.b64 \
            icons/source/approved-02b.b64 \
            icons/source/approved-02c.b64 \
            icons/source/approved-02d.b64 \
            icons/source/approved-03.b64 \
            icons/source/approved-04.b64 \
            icons/source/approved-05.b64 \
            | tr -d '\n\r' | base64 --decode > icons/games-of-alia-180.png
          echo 'fb32b2090243d82cccb93524bd52273501bc3963014eb2cf21634672c39685bf  icons/games-of-alia-180.png' | sha256sum --check
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('icons/games-of-alia-180.png')
          with Image.open(src) as opened:
              img = opened.convert('RGB')
          if img.size != (180, 180):
              raise SystemExit(f'Approved icon has unexpected size: {img.size}')
          for size in (192, 512):
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(Path('icons') / f'games-of-alia-{size}.png', 'PNG', optimize=True)
          print('Approved Games of Alia artwork verified and app icons generated.')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
