name: Deploy Games of Alia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build website and install logo assets
        run: |
          mkdir -p assets icons
          cat \
            assets/exact/part-00.b64 \
            assets/exact/part-01.b64 \
            assets/exact/part-02.b64 \
            assets/exact/part-03.b64 \
            assets/exact/part-04.b64 \
            assets/exact/part-05.b64 \
            assets/exact/part-06.b64 \
            assets/exact/part-07.b64 \
            | tr -d '\n\r' | base64 --decode > assets/games-of-alia-logo.png
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path('assets/games-of-alia-logo.png')
          with Image.open(source) as opened:
              opened.verify()
          with Image.open(source) as opened:
              img = opened.convert('RGBA')
          if img.size != (384, 384):
              raise SystemExit(f'Existing transparent logo has unexpected size: {img.size}')
          if img.getextrema()[3][0] == 255:
              raise SystemExit('Existing logo no longer contains transparency')
          for size in (180, 192, 512):
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(Path('icons') / f'games-of-alia-{size}.png', 'PNG', optimize=True)
          print('Existing transparent Games of Alia logo passed PNG integrity and transparency checks.')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
