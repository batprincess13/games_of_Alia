name: Deploy Games of Alia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build install icons
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          from io import BytesIO
          import base64

          src = Path('icons/games-of-alia-180.png')
          raw = src.read_bytes()
          try:
              img = Image.open(BytesIO(raw)).convert('RGB')
          except Exception:
              decoded = base64.b64decode(raw)
              img = Image.open(BytesIO(decoded)).convert('RGB')
              src.write_bytes(decoded)

          if img.size != (180, 180):
              img = img.resize((180, 180), Image.Resampling.LANCZOS)
              img.save(src, 'PNG', optimize=True)

          for size in (192, 512):
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(Path('icons') / f'games-of-alia-{size}.png', 'PNG', optimize=True)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
